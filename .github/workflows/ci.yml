name: CI Pipeline - SGT Traffic SUMO

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  test:
    name: Ejecutar Plan de Pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          if [ -d "traffic_sumo" ]; then cd traffic_sumo; fi
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas unitarias (PU-01 a PU-04) y cobertura
        run: |
          if [ -d "traffic_sumo" ]; then cd traffic_sumo; fi
          pytest tests/unit/ -v --cov=controller --cov=analysis --cov=tools --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Subir reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            traffic_sumo/coverage.xml
          if-no-files-found: ignore

  docker:
    name: Construir y Probar Dockerfile
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker
        run: |
          if [ -d "traffic_sumo" ]; then cd traffic_sumo; fi
          docker build -t traffic-sumo:${{ github.sha }} .

      - name: Ejecutar pruebas unitarias dentro del contenedor Docker
        run: |
          docker run --rm traffic-sumo:${{ github.sha }} pytest tests/unit/ -v

      - name: Probar ejecución del contenedor (Smoke Test)
        run: |
          docker run --rm traffic-sumo:${{ github.sha }}

  deploy:
    name: Desplegar en GHCR y Validar Runtime
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Convertir propietario a minúsculas para GHCR
        id: owner
        run: |
          echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen en GHCR (docker push)
        run: |
          if [ -d "traffic_sumo" ]; then cd traffic_sumo; fi
          docker build -t ghcr.io/${{ steps.owner.outputs.lc }}/traffic-sumo:latest -t ghcr.io/${{ steps.owner.outputs.lc }}/traffic-sumo:${{ github.sha }} .
          docker push ghcr.io/${{ steps.owner.outputs.lc }}/traffic-sumo:latest
          docker push ghcr.io/${{ steps.owner.outputs.lc }}/traffic-sumo:${{ github.sha }}

      - name: Desplegar contenedor desde el registry (Runtime)
        run: |
          docker pull ghcr.io/${{ steps.owner.outputs.lc }}/traffic-sumo:latest
          docker run --rm ghcr.io/${{ steps.owner.outputs.lc }}/traffic-sumo:latest | tee runtime.log

      - name: Validar despliegue en ambiente de ejecución
        run: |
          grep -q "SGT listo: EXTENDER True" runtime.log

      - name: Subir log de validación en Runtime como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-validation-log
          path: runtime.log
          if-no-files-found: ignore
